<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fuel planner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    :root {
      --ink: #1b2430;
      --muted: #5d6b7c;
      --line: #d9dee5;
      --panel: #ffffff;
      --page: #f3f5f8;
      --accent: #1f6feb;
      --error: #b42318;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--ink);
      background: var(--page);
    }
    header {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      gap: 12px;
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--line);
    }
    h1 { margin: 0 8px 0 0; font-size: 18px; align-self: center; }
    form { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; flex: 1; }
    label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); flex: 1 1 180px; }
    input {
      font: inherit;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--ink);
      background: #fff;
    }
    input:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    button {
      font: inherit;
      font-weight: 600;
      padding: 9px 18px;
      border: 0;
      border-radius: 6px;
      color: #fff;
      background: var(--accent);
      cursor: pointer;
    }
    button:disabled { opacity: .6; cursor: progress; }
    main { flex: 1; display: flex; min-height: 0; }
    #map { flex: 1; min-width: 0; }
    aside {
      width: 360px;
      overflow-y: auto;
      padding: 16px;
      background: var(--panel);
      border-left: 1px solid var(--line);
    }
    #message { margin: 0 0 12px; color: var(--muted); }
    #message.error { color: var(--error); font-weight: 600; }
    .totals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 0 0 16px; }
    .totals div { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; }
    .totals dt { font-size: 12px; color: var(--muted); }
    .totals dd { margin: 2px 0 0; font-size: 20px; font-weight: 700; }
    .totals .cost { grid-column: 1 / -1; }
    .totals .cost dd { font-size: 28px; color: #17803d; }
    h2 { margin: 0 0 8px; font-size: 14px; }
    ol { margin: 0; padding: 0; list-style: none; }
    li.stop { padding: 10px 0; border-top: 1px solid var(--line); cursor: pointer; }
    li.stop:hover { background: var(--page); }
    li.stop b { display: block; }
    li.stop span { color: var(--muted); font-size: 13px; }
    .pin {
      width: 26px; height: 26px; border-radius: 50%;
      display: grid; place-items: center;
      font: 700 13px system-ui, sans-serif; color: #fff;
      border: 2px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4);
    }
    .pin.stop { background: #d97706; }
    .pin.start { background: #17803d; }
    .pin.finish { background: #b42318; }
    @media (max-width: 800px) {
      main { flex-direction: column; }
      #map { min-height: 55vh; flex: none; }
      aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
    }
  </style>
</head>
<body>
  <header>
    <h1>Fuel planner</h1>
    <form id="trip">
      <label>Start
        <input name="start" value="Chicago, IL" placeholder="City, ST or lat,lon" required>
      </label>
      <label>Finish
        <input name="finish" value="Houston, TX" placeholder="City, ST or lat,lon" required>
      </label>
      <button type="submit">Plan route</button>
    </form>
  </header>
  <main>
    <div id="map"></div>
    <aside>
      <p id="message">Enter a start and a finish in the USA, then plan the route.</p>
      <dl class="totals" id="totals" hidden>
        <div class="cost"><dt>Total fuel cost</dt><dd id="t-cost"></dd></div>
        <div><dt>Distance</dt><dd id="t-distance"></dd></div>
        <div><dt>Fuel stops</dt><dd id="t-stops"></dd></div>
      </dl>
      <h2 id="stops-title" hidden>Where to fill up</h2>
      <ol id="stops"></ol>
    </aside>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_URL = "{% url 'route' %}";

    const map = L.map('map').setView([39.5, -98.35], 4);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
      // OpenStreetMap refuses tile requests that arrive without a Referer, and
      // Django's default Referrer-Policy hides it from other sites.
      referrerPolicy: 'origin',
    }).addTo(map);
    const overlay = L.layerGroup().addTo(map);

    const form = document.getElementById('trip');
    const message = document.getElementById('message');
    const totals = document.getElementById('totals');
    const stopsTitle = document.getElementById('stops-title');
    const stopsList = document.getElementById('stops');

    const money = new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' });
    const number = new Intl.NumberFormat('en-US', { maximumFractionDigits: 1 });

    function pin(kind, text) {
      return L.divIcon({
        className: '',
        html: `<div class="pin ${kind}">${text}</div>`,
        iconSize: [26, 26],
        iconAnchor: [13, 13],
        popupAnchor: [0, -14],
      });
    }

    // Text from the server goes in through textContent, never innerHTML.
    function el(tag, text, className) {
      const node = document.createElement(tag);
      node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function popupFor(stop) {
      const box = document.createElement('div');
      box.append(
        el('strong', `${stop.order}. ${stop.name}`),
        document.createElement('br'),
        document.createTextNode(`${stop.city}, ${stop.state}`),
        document.createElement('br'),
        document.createTextNode(`${money.format(stop.price_per_gallon)}/gal · ${number.format(stop.gallons_purchased)} gal`),
        document.createElement('br'),
        el('strong', `Cost ${money.format(stop.cost)}`),
      );
      return box;
    }

    function show(plan) {
      overlay.clearLayers();
      const line = plan.route.geometry.coordinates.map(([lon, lat]) => [lat, lon]);
      const route = L.polyline(line, { color: '#1f6feb', weight: 5, opacity: 0.85 }).addTo(overlay);
      L.marker([plan.start.lat, plan.start.lon], { icon: pin('start', 'A') }).bindPopup(plan.start.name).addTo(overlay);
      L.marker([plan.finish.lat, plan.finish.lon], { icon: pin('finish', 'B') }).bindPopup(plan.finish.name).addTo(overlay);

      stopsList.replaceChildren();
      const markers = plan.fuel_stops.map((stop) => {
        const marker = L.marker([stop.lat, stop.lon], { icon: pin('stop', stop.order) })
          .bindPopup(popupFor(stop)).addTo(overlay);
        const item = el('li', '', 'stop');
        item.append(
          el('b', `${stop.order}. ${stop.name}`),
          el('span', `${stop.city}, ${stop.state} · mile ${number.format(stop.mile_marker)}`),
          document.createElement('br'),
          el('span', `${number.format(stop.gallons_purchased)} gal at ${money.format(stop.price_per_gallon)} = ${money.format(stop.cost)}`),
        );
        item.addEventListener('click', () => { map.setView([stop.lat, stop.lon], 9); marker.openPopup(); });
        stopsList.append(item);
        return marker;
      });
      map.fitBounds(route.getBounds(), { padding: [30, 30] });

      document.getElementById('t-cost').textContent = money.format(plan.summary.total_fuel_cost);
      document.getElementById('t-distance').textContent = `${number.format(plan.summary.distance_miles)} mi`;
      document.getElementById('t-stops').textContent = plan.summary.fuel_stops;
      totals.hidden = false;
      stopsTitle.hidden = plan.fuel_stops.length === 0;

      message.className = '';
      message.textContent = plan.fuel_stops.length
        ? `${plan.start.name} to ${plan.finish.name}, about ${number.format(plan.summary.duration_hours)} hours of driving.`
        : `${plan.start.name} to ${plan.finish.name} is within one tank, so no fuel stop is needed.`;
    }

    function fail(text) {
      message.className = 'error';
      message.textContent = text;
      totals.hidden = true;
      stopsTitle.hidden = true;
      stopsList.replaceChildren();
      overlay.clearLayers();
    }

    async function plan(start, finish) {
      const button = form.querySelector('button');
      button.disabled = true;
      button.textContent = 'Planning…';
      message.className = '';
      message.textContent = 'Planning your route…';
      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ start, finish }),
        });
        const body = await response.json();
        if (!response.ok) {
          fail(body.error ? body.error.message : 'The request failed.');
        } else {
          show(body);
        }
      } catch (error) {
        fail('Could not reach the server.');
      } finally {
        button.disabled = false;
        button.textContent = 'Plan route';
      }
    }

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const data = new FormData(form);
      plan(data.get('start').trim(), data.get('finish').trim());
    });

    // A link such as /fuel-planner/?start=Boston, MA&finish=Denver, CO opens on that trip.
    const params = new URLSearchParams(window.location.search);
    if (params.get('start') && params.get('finish')) {
      form.elements.start.value = params.get('start');
      form.elements.finish.value = params.get('finish');
      plan(params.get('start'), params.get('finish'));
    }
  </script>
</body>
</html>
